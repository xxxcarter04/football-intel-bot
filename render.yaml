services:
  - type: web
    name: football-intel-bot-free
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_HOST
        value: api-football-v1.p.rapidapi.com
      - key: HISTORY_SEASONS
        value: "3"
      - key: CACHE_TTL_HOURS
        value: "6"
      - key: LEAGUE_IDS
        value: 39,140,135,78,61,2
      - key: TIMEZONE
        value: UTC
      - key: DIGEST_TIME
        value: "09:00"
      - key: SELF_PING_URL
        value: https://football-intel-bot-free.onrender.com/
