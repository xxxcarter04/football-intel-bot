# Paid Render background worker.
# - Background workers are paid-only and always on: they never spin down.
# - They do NOT receive inbound HTTP traffic, so no health URL / SELF_PING_URL is needed.
# - Compute is billed per second, prorated; the bot uses long polling for Telegram.
services:
  - type: worker
    name: football-intel-bot-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: 0.5c-512mb
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_HOST
        value: api-football-v1.p.rapidapi.com
      - key: HISTORY_SEASONS
        value: "3"
      - key: CACHE_TTL_HOURS
        value: "6"
      - key: LEAGUE_IDS
        value: 39,140,135,78,61,2
      - key: TIMEZONE
        value: UTC
      - key: DIGEST_TIME
        value: "09:00"
